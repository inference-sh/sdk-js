# Mirrors the install/test/build steps of npm-publish.yml on every push.
#
# Installs with the same tool and lockfile as local dev (pnpm, per-package
# pnpm-lock.yaml) and with strict peer deps, so a dependency change that would
# break consumers fails here instead of at release time.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  install-check:
    name: pnpm install + test + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'pnpm'

      # Strict resolution — fails on lockfile drift or unmet peer deps.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm run build

  # Bot coverage PRs add behavior tests only: no source edits (cc0d2be in
  # sdk-py reverted src/ inside a "tests only" batch), no per-version suites,
  # and no tests that re-assert generated types (src/types.ts).
  bot-test-policy:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'cursor[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          non_test=$(git diff --name-only --no-renames "$BASE"..."$HEAD_SHA" | grep -vE '\.test\.ts$' || true)
          added=$(git diff --name-only --no-renames --diff-filter=A "$BASE"..."$HEAD_SHA")
          versioned=$(echo "$added" | grep -E '(_v[0-9][^/]*|^src/types)\.test\.ts$' || true)
          if [ -n "$non_test" ]; then echo "::error::bot PRs may only change *.test.ts files:"; echo "$non_test"; fi
          if [ -n "$versioned" ]; then echo "::error::bot PRs must not add per-version or generated-type test files:"; echo "$versioned"; fi
          [ -z "$non_test$versioned" ]
